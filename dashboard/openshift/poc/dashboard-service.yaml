apiVersion: v1
kind: Service
metadata:
  name: winc-dashboard-poc
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: winc-dashboard-poc-tls
  labels:
    app: winc-dashboard-poc
spec:
  selector:
    app: winc-dashboard-poc
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
    - protocol: TCP
      port: 8443
      targetPort: 8443
      name: https
  type: ClusterIP
