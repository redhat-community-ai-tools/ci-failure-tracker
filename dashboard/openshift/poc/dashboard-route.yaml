apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: winc-dashboard-poc
  labels:
    app: winc-dashboard-poc
  annotations:
    # Must exceed ai.timeout_seconds (default 300, max 1800) and the
    # gunicorn --timeout (600), or HAProxy closes the connection while a
    # thinking model is still generating and the caller sees a gateway
    # error even though the analysis completed.
    haproxy.router.openshift.io/timeout: 1900s
spec:
  to:
    kind: Service
    name: winc-dashboard-poc
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
