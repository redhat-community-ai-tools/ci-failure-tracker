apiVersion: apps/v1
kind: Deployment
metadata:
  name: winc-dashboard-poc
  labels:
    app: winc-dashboard-poc
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"winc-dashboard-poc:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"dashboard\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: winc-dashboard-poc
  template:
    metadata:
      labels:
        app: winc-dashboard-poc
    spec:
      serviceAccountName: winc-dashboard-poc
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/winc-dashboard-poc/winc-dashboard-poc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: REPORTPORTAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reportportal-token
                  key: token
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: prow-api-token
                  key: token
            - name: ENMAAS_KEY
              valueFrom:
                secretKeyRef:
                  name: enmaas-api-key
                  key: api-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
        - name: oauth-proxy
          image: quay.io/openshift/origin-oauth-proxy:4.14
          ports:
            - containerPort: 8443
              protocol: TCP
              name: https
          args:
            - --provider=openshift
            - --openshift-service-account=winc-dashboard-poc
            - --upstream=http://localhost:8080
            - --https-address=:8443
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/var/run/secrets/oauth-proxy/cookie-secret
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: cookie-secret
              mountPath: /var/run/secrets/oauth-proxy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: winc-dashboard-poc-data
        - name: config
          configMap:
            name: dashboard-config-poc
        - name: tls
          secret:
            secretName: winc-dashboard-poc-tls
        - name: cookie-secret
          secret:
            secretName: oauth-proxy-secret
