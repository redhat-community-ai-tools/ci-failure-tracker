# CI Test Pass Rate Dashboard Configuration
#
# ============================================================================
# CUSTOMIZE THIS FILE FOR YOUR TEAM
# ============================================================================
#
# This is currently configured for the Windows Containers (WinC) QE team.
# To use for your team:
# 1. Update job_patterns below to match your periodic CI jobs
# 2. Adjust versions and platforms in the tracking section
# 3. Update blocklist with test IDs to exclude
# 4. Deploy to OpenShift or run locally
#
# Example job patterns for different teams:
#   - Networking: "periodic-ci-*-network-*", "periodic-ci-*-ovn-*"
#   - Storage:    "periodic-ci-*-storage-*", "periodic-ci-*-csi-*"
#   - Your team:  "periodic-ci-*-{your-component}-*"
# ============================================================================

# Data collector configuration
collector:
  # Type of collector: "reportportal", "prow_mcp", "prow_gcs", "gcsweb"
  # Production uses ReportPortal
  # POC uses prow_gcs (direct GCS access via QE Private Prow)
  type: "gcsweb"

  # ReportPortal configuration
  reportportal:
    url: "https://reportportal-openshift.apps.dno.ocp-hub.prod.psi.redhat.com"
    project: "prow"
    # API token from environment variable: REPORTPORTAL_API_TOKEN

    # ========================================================================
    # CUSTOMIZE: Job name patterns to monitor for your team
    # {version} will be replaced with each version from tracking.versions
    #
    # Job types:
    # - periodic-ci-* = Periodic/nightly jobs
    # - pull-ci-* = Presubmit jobs (run on PRs)
    # - branch-ci-* = Postsubmit jobs (run after merge)
    # ========================================================================
    job_patterns:
      # Periodic (nightly) jobs
      - "periodic-ci-openshift-openshift-tests-private-release-{version}-*-winc-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-{version}-*"

      # Presubmit (PR) jobs - for debugging PR failures
      - "pull-ci-openshift-openshift-tests-private-release-{version}-*-winc-*"
      - "pull-ci-openshift-windows-machine-config-operator-release-{version}-*-winc-*"
      - "pull-ci-openshift-windows-machine-config-operator-*-e2e-*"

      # Rehearse jobs (test changes to CI config before merging)
      - "rehearse-*-periodic-ci-openshift-openshift-tests-private-release-{version}-*-winc-*"
      - "rehearse-*-periodic-ci-openshift-windows-machine-config-operator-release-{version}-*"
      - "rehearse-*-pull-ci-openshift-openshift-tests-private-release-{version}-*-winc-*"
      - "rehearse-*-pull-ci-openshift-windows-machine-config-operator-*-winc-*"

      # vSphere proxy/disconnected variants (for proxy and disconnected testing)
      - "periodic-ci-openshift-openshift-tests-private-release-{version}-*-vsphere-ipi-proxy-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-{version}-*-vsphere-ipi-disconnected-*-winc-*"

      # Postsubmit jobs (after merge)
      - "branch-ci-openshift-windows-machine-config-operator-*"

    # API settings
    page_size: 150
    max_pages: 10
    max_workers: 5

  # Prow GCS configuration (queries gs://origin-ci-test/logs/ directly)
  prow_gcs:
    # GCS bucket (default: origin-ci-test, publicly accessible for OpenShift CI)
    bucket: "origin-ci-test"

    # Job patterns to monitor (supports wildcards: * matches any characters)
    # These patterns match periodic, pull, and rehearse WINC jobs
    job_patterns:
      # Periodic (nightly) jobs - all tracked versions
      - "periodic-ci-openshift-openshift-tests-private-release-4.18-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.19-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.20-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.21-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.23-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-5.0-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-5.1-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-main-*-winc-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-4.18-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-4.19-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-4.20-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-4.21-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-4.22-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-4.23-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-5.0-*"
      - "periodic-ci-openshift-windows-machine-config-operator-release-5.1-*"

      # Pull request (presubmit) jobs
      - "pull-ci-openshift-openshift-tests-private-*-winc-*"
      - "pull-ci-openshift-windows-machine-config-operator-*-winc-*"

      # Rehearse jobs (test changes to CI config)
      - "rehearse-*-periodic-ci-openshift-openshift-tests-private-*-winc-*"
      - "rehearse-*-periodic-ci-openshift-windows-machine-config-operator-*"
      - "rehearse-*-pull-ci-openshift-openshift-tests-private-*-winc-*"

    # How many recent builds to fetch per job (default: 50)
    max_builds_per_job: 50

    # Parallel processing
    max_workers: 5

  # gcsweb configuration (QE Private Deck - requires API_KEY token)
  gcsweb:
    # Base URL (private instance for openshift-tests-private jobs)
    url: "https://gcsweb-qe-private-deck-ci.apps.ci.l2s4.p1.openshiftapps.com"
    bucket: "qe-private-deck"

    # WINC job names from ../release repo (exact names from Prow)
    job_names:
      # Wildcard patterns per version - catches all platforms, filters,
      # naming variants (zstream), IPI/UPI, proxy/disconnected, and upgrades.
      # Replaces 50+ explicit job names with 8 patterns.
      - "periodic-ci-openshift-openshift-tests-private-release-4.18-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.19-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.20-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.21-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-4.23-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-5.0-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-release-5.1-*-winc-*"
      - "periodic-ci-openshift-openshift-tests-private-main-*-winc-*"

    # Postsubmit FBC job discovery via GCS JSON API prefix listing.
    # Resolves matching job names at startup without listing the
    # entire logs/ directory (which times out on large public buckets).
    postsubmit_job_prefixes:
      - "branch-ci-openshift-windows-machine-config-operator-fbc-"

    # PR log sources: scan pr-logs/ for rehearse and PR jobs
    pr_log_sources:
      - repo: "openshift_release"
        job_pattern: "*winc*"
        max_prs: 30
      - repo: "openshift_openshift-tests-private"
        job_pattern: "*winc*"
        max_prs: 20

    # WMCO-to-OCP version mapping for FBC postsubmit jobs
    # WMCO major version minus 6 = OCP major version
    # e.g., v10-21 -> WMCO 10.21 -> OCP 4.21
    wmco_version_map:
      "10": "4"
      "11": "5"

    # Default OCP version for FBC postsubmit jobs that have no v10-XX
    # variant in the job name (e.g., fbc-main-aws-winc).  These jobs
    # target OCP 5.0 (ci-operator config uses version: "5.0").
    fbc_default_version: "5.0"

    # Public gcsweb instance for postsubmit jobs from public repos.
    # FBC postsubmit jobs (openshift/windows-machine-config-operator-fbc)
    # are in the public origin-ci-test bucket, not qe-private-deck.
    postsubmit_gcsweb:
      url: "https://gcsweb-ci.apps.ci.l2s4.p1.openshiftapps.com"
      bucket: "test-platform-results"
      deck_url: "https://prow.ci.openshift.org"

    # How many recent builds to fetch per job (reduced for initial testing)
    max_builds_per_job: 20

    # Parallel processing (jobs processed concurrently)
    max_workers: 5

    # Operator version extraction patterns (tried in order, first match wins).
    # Each pattern must contain one capture group for the version string.
    # Add or remove patterns here when WMCO changes its log format.
    operator_version:
      patterns:
        - '"version"\s*:\s*"(\d+\.\d+\.\d+-[0-9a-f]+)"'
        - 'operator\s+version\s+(\d+\.\d+\.\d+-[0-9a-f]+)'

  # prow_mcp configuration (POC - uses prow-mcp-server)
  prow_mcp:
    # MCP server URL (run prow-mcp-server separately)
    # Default: http://localhost:3000
    # For OpenShift POC: http://prow-mcp-server:3000 (in same namespace)
    server_url: "http://localhost:3000"

    # WINC job names (same as gcsweb)
    job_names:
      # 4.21 WINC jobs
      - "periodic-ci-openshift-openshift-tests-private-release-4.21-amd64-nightly-aws-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.21-amd64-nightly-azure-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.21-amd64-nightly-gcp-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.21-amd64-nightly-nutanix-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.21-amd64-nightly-vsphere-ipi-ovn-winc-f7"

      # 4.22 WINC jobs
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-amd64-nightly-aws-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-amd64-nightly-aws-upi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-amd64-nightly-azure-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-amd64-nightly-gcp-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-amd64-nightly-nutanix-ipi-ovn-winc-f7"
      - "periodic-ci-openshift-openshift-tests-private-release-4.22-amd64-nightly-vsphere-ipi-ovn-winc-f7"

    # Parallel processing
    max_workers: 5

# Tracking configuration
tracking:
  # ========================================================================
  # CUSTOMIZE: OpenShift versions to monitor for your team
  # ========================================================================
  versions:
    - "4.18"
    - "4.19"
    - "4.20"
    - "4.21"
    - "4.22"
    - "4.23"
    - "5.0"
    - "5.1"

  # Map branch names to versions (e.g., "main" branch jobs map to "5.0")
  branch_version_map:
    main: "5.1"

  # ========================================================================
  # CUSTOMIZE: Cloud platforms to track for your team
  # Common platforms: aws, azure, gcp, vsphere, nutanix, metal, alibabacloud
  # ========================================================================
  platforms:
    - "aws"
    - "azure"
    - "gcp"
    - "nutanix"
    - "vsphere"

  # ========================================================================
  # CUSTOMIZE: Test suite filter - only collect tests matching this pattern
  #
  # Examples for different teams:
  #   - Windows Containers: "Windows_Containers"
  #   - Networking:         "Networking"
  #   - Storage:            "Storage"
  #   - Leave empty to collect all tests (no filter)
  #
  # The filter checks if this string appears in the raw test name/description
  # before any processing. This helps exclude unrelated test suites.
  # ========================================================================
  test_suite_filter: "Windows_Containers"

  # Source repository URL for Build Health commit links
  source_repo_url: "https://github.com/openshift/windows-machine-config-operator"

  # How many days to look back when collecting data
  lookback_days: 30

  # ========================================================================
  # CUSTOMIZE: Blocklist - exclude specific test IDs from dashboard
  # Add test IDs that should not appear in your team's dashboard
  # Note: Dashboard automatically filters to show only OCP-* tests
  # ========================================================================
  blocklist:
    - "OCP-60944"  # Example: Removed from test suite
    - "OCP-65980"  # Proxy test - known issue OCPBUGS-111093
    - "OCP-71173"  # Proxy test - known issue OCPBUGS-111093

# Build Health configuration
build_health:
  # Job name keywords to exclude from releasability calculation.
  # Jobs matching any of these keywords (case-insensitive substring match)
  # are excluded from Build Health pass/fail counts. They test specific
  # infrastructure scenarios (disconnected registries, proxies) whose
  # failures do not indicate the WMCO build itself is broken.
  excluded_job_keywords:
    - "disconnected"
    - "proxy"

  # Exclude specific test IDs from releasability calculation
  # Jobs that fail ONLY due to these tests won't block releases
  # These tests are linked to known infrastructure bugs (e.g., OCPBUGS-111093)
  # Note: Only include test IDs that are actively failing. Don't add passing
  # tests (OCP-66670, OCP-68320) or non-existent tests (OCP-74760).
  excluded_test_ids:
    - "OCP-65980"   # Proxy test - known issue OCPBUGS-111093
    - "OCP-71173"   # Proxy test - known issue OCPBUGS-111093

  # Known upstream issues: tests linked to bugs outside the team's control.
  # These tests are excluded from the releasability calculation (via
  # excluded_test_ids above) and shown separately in Build Health with a
  # "Known Issue" badge so they remain visible for tracking.
  known_issues:
    - test_id: "OCP-65980"
      bug: "OCPBUGS-111093"
    - test_id: "OCP-71173"
      bug: "OCPBUGS-111093"

# Database configuration
database:
  # Path to SQLite database file
  path: "/data/dashboard.db"

# Web server configuration
web:
  host: "0.0.0.0"
  port: 8080
  debug: false

# Collection schedule (for automated runs)
schedule:
  # Run data collection automatically
  enabled: false

  # Cron expression (e.g., "0 9 * * *" for daily at 9 AM)
  cron: "0 9 * * *"
